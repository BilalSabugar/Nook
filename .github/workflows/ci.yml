name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Verify ESLint code quality
        run: npm run lint

      - name: Verify TypeScript types
        run: npm run typecheck

      - name: Pre-pull Docker sandbox image
        run: docker pull node:22-alpine

      - name: Run unit & integration test suite
        run: npm test

      - name: Build Next.js application
        run: npm run build

  compose-e2e:
    name: Production Docker Compose Integration
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Pre-pull Base Container Images
        run: |
          docker pull node:24-alpine
          docker pull node:22-alpine
          docker pull docker:27-dind-rootless

      - name: Build and Start Production Stack with Docker Compose
        env:
          SANDBOX_RUNNER_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: |
          docker compose up -d --build

      - name: Run Production Integration & Cross-Agent Isolation Verification
        env:
          SANDBOX_RUNNER_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          SANDBOX_SERVICE_URL: http://127.0.0.1:4000
          WEB_SERVICE_URL: http://127.0.0.1:3000
        run: |
          node bin/test-production-compose.mjs

      - name: Display Container Logs on Failure
        if: failure()
        run: |
          docker compose logs

      - name: Teardown Services
        if: always()
        run: |
          docker compose down -v
