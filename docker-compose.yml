services:
  nook:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nook-app
    image: nook:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SANDBOX_SERVICE_URL=http://sandbox-runner:4000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - NOOK_PASSWORD=${NOOK_PASSWORD:-}
      - NOOK_API_KEY=${NOOK_API_KEY:-}
      - NOOK_SECRET_KEY=${NOOK_SECRET_KEY:-}
      - SANDBOX_RUNNER_SECRET=${SANDBOX_RUNNER_SECRET:?SANDBOX_RUNNER_SECRET environment variable is required. Generate with: openssl rand -hex 32}
    depends_on:
      sandbox-runner:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - nook_data:/app/.nook_storage
      - nook_sandboxes:/app/.nook_sandboxes

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nook-worker
    image: nook:latest
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    depends_on:
      nook:
        condition: service_healthy
      sandbox-runner:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - NOOK_WORKER_ROLE=dedicated_worker
      - SANDBOX_SERVICE_URL=http://sandbox-runner:4000
      - SANDBOX_RUNNER_SECRET=${SANDBOX_RUNNER_SECRET:?SANDBOX_RUNNER_SECRET environment variable is required. Generate with: openssl rand -hex 32}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - NOOK_PASSWORD=${NOOK_PASSWORD:-}
      - NOOK_API_KEY=${NOOK_API_KEY:-}
      - NOOK_SECRET_KEY=${NOOK_SECRET_KEY:-}
    volumes:
      - nook_data:/app/.nook_storage
      - nook_sandboxes:/app/.nook_sandboxes

  sandbox-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nook-sandbox-runner
    image: nook:latest
    restart: unless-stopped
    command: ["npm", "run", "sandbox-runner"]
    depends_on:
      container-supervisor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000/health"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 5s
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DOCKER_HOST=tcp://container-supervisor:2375
      - SANDBOX_VOLUME_NAME=nook_sandboxes
      - SANDBOX_RUNNER_SECRET=${SANDBOX_RUNNER_SECRET:?SANDBOX_RUNNER_SECRET environment variable is required. Generate with: openssl rand -hex 32}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    volumes:
      - nook_sandboxes:/app/.nook_sandboxes
    networks:
      - default
      - sandbox_internal

  container-supervisor:
    image: docker:27-dind-rootless
    container_name: nook-container-supervisor
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - DOCKER_TLS_CERTDIR=
    volumes:
      - nook_sandboxes:/app/.nook_sandboxes
    networks:
      - sandbox_internal
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  nook_data:
    driver: local
  nook_sandboxes:
    name: nook_sandboxes
    driver: local

networks:
  default:
  sandbox_internal:
    internal: true
